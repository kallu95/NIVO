async function runPitch(sample){const out=$('#pOut');const files=sample?[]:[...($('#pf').files||[])];let text=($('#ptx').value||'').trim();const imgs=files.filter(f=>/^image\//.test(f.type)).slice(0,5),pdfs=files.filter(f=>/pdf/.test(f.type)||/\.pdf$/i.test(f.name));
  if(!text&&!imgs.length&&!pdfs.length){toast('Upload a file or paste the pitch first');return;}
  const steps=['Reading the pitch','Finding the funds named','Checking each claim against the data','Writing your questions'];out.innerHTML=`<div class="card"><ul class="prog-steps">${steps.map(s=>`<li><span class="tk">${I.tick}</span>${s}</li>`).join('')}</ul><button class="link" data-act="pitch-stop" style="margin-top:8px">Stop</button></div>`;const lis=$$('.prog-steps li',out);const st=i=>lis.forEach((l,j)=>l.className=j<i?'done':j===i?'now':'');st(0);
  try{if(pdfs.length){const t=await pdfText(pdfs[0],'',30);text=(text?text+'\n\n':'')+t;}}catch(e){out.innerHTML=`<div class="flag">${I.warn}<span>Couldn't read that PDF${e&&e.name==='PasswordException'?' (it is password-protected)':''}. Try screenshots of the slides instead.</span></div>`;return;}
  const ai=await getAI();if(!ai){if(!text){out.innerHTML=`<div class="flag">${I.warn}<span>Photos can't be read here. Upload the PDF or paste the text instead.</span></div>`;return;}st(1);await new Promise(r=>setTimeout(r,300));st(2);await new Promise(r=>setTimeout(r,300));st(3);showPitch(localPitch(text));return;}
  if(imgs.length){try{const lim=await ai.limits();if(!lim.images){out.innerHTML=`<div class="flag">${I.warn}<span>Images can't be sent from this view. Paste the text or upload a PDF instead.</span></div>`;return;}}catch(e){}}
  const ctl=new AbortController();pitchCtl=ctl;let seen=0;const note=s=>{seen++;st(seen<2?1:2);};
  const prompt=`You are NIVO's independent pitch checker for Indian investors. Check the pitch below from a relationship manager or wealth manager.
1. Identify every mutual fund, PMS or product named, and every factual claim (returns, rankings, risk, falls, fees, suitability, track record).
2. Use the tools to look up the real numbers: search_funds then fund_details for mutual funds; search_pms for PMS; category_stats for category comparisons. Data is to ${D.asof} (mutual funds) and ${D.pmsU.asof} (PMS). Expense ratios are not in the data, but the Direct vs Regular return gap is.
3. Judge each claim as "true", "partly", "misleading" or "unverifiable", with a one-sentence finding that quotes the real figures.
4. Judge suitability against this investor's IPS: ${ipsBrief()}
Reply with ONLY JSON: {"products":[{"name":"","code":number or null}],"claims":[{"claim":"short paraphrase","verdict":"true|partly|misleading|unverifiable","finding":"one sentence with real numbers"}],"score":0-100 honesty score,"headline":"4-7 words","summary":"2 sentences","fit_for_you":"1-2 sentences against the IPS","questions":["five sharp questions to ask the RM"]}
${imgs.length?'The pitch is in the attached images (slides or screenshots).':''}
Pitch:
"""
${(text||'(see images)').slice(0,60000)}
"""`;
  try{const r=await ai.json(prompt,{tools:toolDefs(note),images:imgs.length?imgs:undefined,signal:ctl.signal});st(3);showPitch(r,sample);}
  catch(e){const c=e&&e.code;out.innerHTML=c==='cancelled'?'':`<div class="flag">${I.warn}<span>${c==='not_granted'||c==='sampling_disabled'?'Claude access was not allowed for this page.':c==='rate_limited'?'Too many requests right now. Try again in a minute.':c==='invalid_json'?'The check came back in an unexpected format. Try again.':c==='image_rejected'?'One of the images could not be read. Try a clearer screenshot.':'Something went wrong. Try again.'}</span></div>`;}
  finally{pitchCtl=null;}}
function showPitch(r,sample){const out=$('#pOut');const cl=Array.isArray(r.claims)?r.claims:[];const n={true:0,partly:0,misleading:0,unverifiable:0};cl.forEach(c=>{const v=String(c.verdict||'').toLowerCase();n[v in n?v:'unverifiable']++;});const score=clamp(Math.round(+r.score||0),0,100);
  const lab={true:['good','True'],partly:['warn','Partly true'],misleading:['bad','Misleading'],unverifiable:['plain','Can\'t verify']};const prods=(Array.isArray(r.products)?r.products:[]).filter(p=>p&&p.code&&D.byCode.get(+p.code));
  out.innerHTML=`<div class="card" style="display:grid;gap:10px"><p class="eyebrow" style="text-align:center">Truth meter</p>
   <svg class="gauge" viewBox="0 0 220 132" role="img" aria-label="Honesty score ${score} out of 100"><path d="${arc(0,.4,88)}" stroke="var(--bad)" stroke-width="14" fill="none" stroke-linecap="round"/><path d="${arc(.42,.68,88)}" stroke="var(--warn)" stroke-width="14" fill="none"/><path d="${arc(.7,1,88)}" stroke="var(--good)" stroke-width="14" fill="none" stroke-linecap="round"/><g class="needle"><path d="M107 112 L110 44 L113 112 Z" fill="var(--ink)"/></g><circle cx="110" cy="112" r="8" fill="var(--ink)"/><text x="110" y="92" text-anchor="middle" font-size="26" font-weight="800">${score}</text></svg>
   <p style="text-align:center;margin:-4px 0 0;font:700 16px var(--f-display)">${esc(r.headline||'')}</p><p class="small muted" style="text-align:center;margin:0">${esc(r.summary||'')}</p>
   <div class="tally"><div class="g"><b>${n.true}</b><small>True</small></div><div class="a"><b>${n.partly}</b><small>Partly</small></div><div class="r"><b>${n.misleading}</b><small>Misleading</small></div><div class="u"><b>${n.unverifiable}</b><small>Unclear</small></div></div></div>
  ${r.fit_for_you?`<div class="flag info">${I.target}<span>${esc(r.fit_for_you)}</span></div>`:''}
  ${prods.length||(r.pms&&r.pms.length)?`<div class="sblock"><h3>Products in this pitch</h3><div class="rlist">${(r.pms||[]).map(id=>pmsById(id)).filter(Boolean).map(p=>pmsRow(p)).join('')}${prods.map(p=>fundRow(D.byCode.get(+p.code))).join('')}</div></div>`:''}
  <div class="sec-h"><h3>Claim by claim</h3></div>${cl.map(c=>{const v=String(c.verdict||'').toLowerCase(),l=lab[v]||lab.unverifiable;return `<div class="claim"><span class="pill ${l[0]}" style="justify-self:start">${l[1]}</span><q>${esc(c.claim)}</q><p>${esc(c.finding)}</p></div>`;}).join('')}
  ${Array.isArray(r.questions)&&r.questions.length?`<div class="sec-h"><h3>Questions to ask</h3><button class="link" data-act="copy-pq">Copy all</button></div><ol class="qs" id="pqs">${r.questions.slice(0,6).map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`:''}
  <p class="tiny" style="margin:0">Checked by Claude against AMFI NAVs to ${dt(D.asof)} and PMS data to ${dt(D.pmsU.asof)}. Review the findings before acting.</p>`;
  animateIn(out);const nd=$('.needle',out);requestAnimationFrame(()=>requestAnimationFrame(()=>{nd.style.transform=`rotate(${-90+180*score/100}deg)`;}));out._q=(r.questions||[]).join('\n');}

/* ================= routing ================= */
const VIEWS=['home','explore','ask','portfolio','ips','about'];let cur='home';
function renderView(v){if(!D)return;if(v==='home')renderHome();else if(v==='explore')renderExplore();else if(v==='ask')renderAsk();else if(v==='portfolio')renderPortfolio();else if(v==='ips')renderIPS();else if(v==='about')renderAbout();}
function refresh(){renderView(cur);}
function moveInd(){const on=$('.tab.on'),ind=$('#ind');if(!on||on.classList.contains('cta')){ind.style.opacity=0;return;}ind.style.opacity=1;ind.style.left=on.offsetLeft+4+'px';ind.style.width=on.offsetWidth-8+'px';}
function route(){let v=location.hash.slice(1);if(!VIEWS.includes(v))v='home';cur=v;$$('.view').forEach(s=>s.hidden=s.dataset.view!==v);$$('.tab,.tn').forEach(t=>t.classList.toggle('on',t.dataset.go===v));moveInd();closeSheet();window.scrollTo({top:0});renderView(v);}
addEventListener('hashchange',route);addEventListener('resize',moveInd);
function go(v){if(location.hash.slice(1)===v){route();}else location.hash=v;}

/* ================= events ================= */
let xT=null;
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.tap');if(!t||RM)return;const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');sp.className='rip';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;t.appendChild(sp);setTimeout(()=>sp.remove(),700);});
document.addEventListener('input',e=>{if(e.target.id==='xq'){S.x.q=e.target.value;S.x.limit=30;const c=$('.clr');if(c)c.hidden=!S.x.q;clearTimeout(xT);xT=setTimeout(()=>renderXList(false),110);}});
document.addEventListener('change',e=>{if(e.target.id==='xsort'){S.x.sort=e.target.value;S.x.limit=30;renderXList(true);}if(e.target.id==='psort'){S.x.psort=e.target.value;S.x.limit=30;renderXList(true);}});
document.addEventListener('click',e=>{if(!D)return;const pop=$('#jgPop');if(!pop.hidden)pop.hidden=true;
  const el=e.target.closest('[data-person],[data-fund],[data-pms],[data-co],[data-go],[data-act],[data-xs],[data-asset],[data-xcat],[data-am],[data-sug],[data-wk]');if(!el)return;
  if(el.dataset.wk){wz.a[el.dataset.wk]=el.dataset.wv;$$(`[data-wk="${el.dataset.wk}"]`).forEach(b=>b.classList.toggle('on',b===el));return;}
  if(el.dataset.fund){openFund(el.dataset.fund);return;}
  if(el.dataset.pms){openPMS(el.dataset.pms);return;}
  if(el.dataset.person){openPerson(el.dataset.person);return;}
  if(el.dataset.co){openCompany(el.dataset.co);return;}
  if(el.dataset.go){go(el.dataset.go);return;}
  if(el.dataset.xs){S.x.seg=el.dataset.xs;S.x.limit=30;$$('#xseg button').forEach(b=>b.classList.toggle('on',b===el));renderXFilters();renderXList(true);return;}
  if(el.dataset.asset){S.x.asset=el.dataset.asset;S.x.cat='';S.x.limit=30;renderXFilters();renderXList(true);return;}
  if(el.dataset.xcat!=null&&el.dataset.xcat!==undefined&&el.hasAttribute('data-xcat')){S.x.cat=el.dataset.xcat;S.x.limit=30;renderXFilters();renderXList(true);return;}
  if(el.dataset.am){askMode=el.dataset.am;drawAsk();animateIn($('#askBox'));return;}
  if(el.dataset.sug){sendChat(el.dataset.sug);return;}
  const a=el.dataset.act;
  if(a==='close')closeSheet();
  else if(a==='search-focus'){go('explore');setTimeout(()=>{const q=$('#xq');if(q)q.focus();},80);}
  else if(a==='xclear'){S.x.q='';S.x.limit=30;const q=$('#xq');q.value='';el.hidden=true;renderXList(true);q.focus();}
  else if(a==='xdirect'){S.x.direct=!S.x.direct;S.x.limit=30;$('.switch',el).classList.toggle('on',S.x.direct);renderXList(true);}
  else if(a==='xmore'){S.x.limit+=40;renderXList(false);}
  else if(a==='xsearch'){S.x={...S.x,q:el.dataset.q,seg:el.dataset.seg||'mf',asset:'All',cat:'',limit:30};closeSheet();go('explore');}
  else if(a==='xseg-pms'){S.x={...S.x,q:'',seg:'pms',limit:30};closeSheet();go('explore');}
  else if(a==='xseg-mf'){S.x={...S.x,q:'',seg:'mf',limit:30};closeSheet();go('explore');}
  else if(a==='pst'){S.x.pst=el.dataset.v;S.x.limit=30;renderXFilters();renderXList(true);}
  else if(a==='ptr'){S.x.ptr=+el.dataset.v;S.x.limit=30;renderXFilters();renderXList(true);}
  else if(a==='ai-pms')runAiPms();
  else if(a==='faq'){const f=el.closest('.faq'),open=!f.classList.contains('open');f.classList.toggle('open',open);el.setAttribute('aria-expanded',open);}
  else if(a==='persona'){S.persona=el.dataset.v;Store.save();if(wz&&!S.answers){Object.assign(wz.a,PERSONAS.find(x=>x.k===S.persona).pre);if($('#wzBox'))drawWz((wz.i+1)/WZ.length*100);}const sec=el.closest('[data-persona]');const t=document.createElement('div');t.innerHTML=personaHTML();const nw=t.firstElementChild;sec.replaceWith(nw);const c=$('#pcard',nw);if(c){c.classList.add('swap');}const tb=$(`.ptab[data-v="${S.persona}"]`,nw);if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'center',behavior:RM?'auto':'smooth'});}
  else if(a==='persona-go'){S.persona=el.dataset.v;Store.save();const p=PERSONAS.find(x=>x.k===el.dataset.v);if(!S.ips&&$('#wzCard')){$('#wzCard').scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});return;}openWizard(S.answers?null:p.pre);}
  else if(a==='wz-cancel'){S.wzOpen=false;renderIPS();}
  else if(a==='ai-pms-stop'){if(aiPmsCtl)aiPmsCtl.abort();}
  else if(a==='wizard')openWizard();
  else if(a==='wz-next'){if(wz.i<WZ.length-1){const p=(wz.i+1)/WZ.length*100;wz.i++;drawWz(p);const c=$('#wzCard');if(c)c.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});}else finishWizard();}
  else if(a==='wz-back'){const p=(wz.i+1)/WZ.length*100;wz.i--;drawWz(p);}
  else if(a==='import')openImport();
  else if(a==='add-manual')openAdd('mf');
  else if(a==='add-fund')openAdd('mf',el.dataset.code);
  else if(a==='add-pms')openAdd('pms',el.dataset.id);
  else if(a==='hold-remove'){S.holdings=S.holdings.filter(h=>h.id!==el.dataset.id);Store.save();closeSheet();refresh();toast('Removed');}
  else if(a==='hold-del'){S.holdings=S.holdings.filter(h=>h.id!==el.dataset.id);if(!S.holdings.length)S.pfEdit=false;Store.save();renderPortfolio();toast('Removed');}
  else if(a==='pf-edit'){S.pfEdit=!S.pfEdit;renderPortfolio();}
  else if(a==='mydata')openMyData();
  else if(a==='confirm'){if(!el.dataset.sure){el.dataset.sure='1';el._t=el.textContent;el.textContent='Tap again to confirm';el.classList.add('sure');setTimeout(()=>{if(el.isConnected&&el.dataset.sure){delete el.dataset.sure;el.textContent=el._t;el.classList.remove('sure');}},4000);return;}doWipe(el.dataset.do);}
  else if(a==='hold-edit'){const h=S.holdings.find(x=>x.id===el.dataset.id);if(!h)return;openSheet(`<p class="eyebrow">Holding</p><h2 class="sheet-h">${esc(h.name)}</h2><div class="field"><label for="hev">Current value</label><div class="money"><span>₹</span><input id="hev" inputmode="decimal" value="${Math.round(hv(h))}"><em id="hevH"></em></div></div><button class="btn pri" data-act="hold-save" data-id="${h.id}">Save</button><button class="btn sec" data-act="hold-remove" data-id="${h.id}">Remove</button>`,b=>moneyHelper($('#hev',b),$('#hevH',b)));}
  else if(a==='hold-save'){const h=S.holdings.find(x=>x.id===el.dataset.id),v=parseMoney($('#hev').value);if(h&&v){h.value=v;Store.save();closeSheet();refresh();toast('Saved');}}
  else if(a==='cmp-add'){const c=+el.dataset.code;if(!S.cmp.includes(c)){S.cmp.push(c);if(S.cmp.length>2)S.cmp.shift();}if(S.cmp.length===2)openCompare();else toast('Added. Open another fund and tap Compare');}
  else if(a==='slot')openSlot(el.dataset.k);
  else if(a==='copy-ips')copyText(ipsText(),'IPS copied');
  else if(a==='copy-pq')copyText($('#pOut')._q||'','Questions copied');
  else if(a==='pitch-tab'){askMode='pitch';closeSheet();go('ask');}
  else if(a==='pitch-run')runPitch(false);
  else if(a==='pitch-stop'){if(pitchCtl)pitchCtl.abort();}
  else if(a==='chat-clear'){if(chatCtl)chatCtl.abort();S.chat=[];drawAsk();}
  else if(a==='ask-about'){askMode='chat';closeSheet();go('ask');setTimeout(()=>sendChat(el.dataset.q),120);}
  else if(a==='ask-fund'){const f=D.byCode.get(+el.dataset.code);askMode='chat';closeSheet();go('ask');setTimeout(()=>sendChat(`Is ${f.sn} (${f.direct?'Direct':'Regular'}, code ${f.c}) right for me? What are its strengths, weaknesses and better alternatives?`),120);}
  else if(a==='ask-pms'){const p=pmsById(el.dataset.id);askMode='chat';closeSheet();go('ask');setTimeout(()=>sendChat(`Should I consider the ${p.n} PMS by ${p.pm} (id ${p.id})? How does it compare with good mutual funds for my IPS?`),120);}
  else if(a==='ask-cmp'){const [x,y]=S.cmp.map(c=>D.byCode.get(c));askMode='chat';closeSheet();go('ask');setTimeout(()=>sendChat(`Compare ${x.sn} (code ${x.c}) and ${y.sn} (code ${y.c}). Which suits my IPS better and why?`),120);}
  else if(a==='ask-ips'){askMode='chat';go('ask');setTimeout(()=>sendChat('Explain my IPS in simple words: why this mix, what the risk limits mean, and the three most important things I should do next.'),120);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();$('#jgPop').hidden=true;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="link"]')){e.preventDefault();e.target.click();}});

/* ================= boot ================= */
(async function boot(){
  $('#v-home').innerHTML='<div class="skel" style="height:90px"></div><div class="skel" style="height:180px"></div><div class="skel"></div><div class="skel"></div>';
  try{await loadData();}catch(e){$('#v-home').innerHTML=`<div class="flag">${I.warn}<span>The fund database didn't load. Reload the page to try again.</span></div>`;($('#asof')||{}).textContent='Offline';return;}
  ($('#asof')||{}).textContent='Data to '+new Date(D.asof+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  setIPS();route();
  getAI();
  await Store.init();const st=await Store.load();
  if(st){let dirty=!!(st.exIPS||st.exPF);
    if(st.answers&&!st.exIPS)S.answers={...BLANK_A,...st.answers};
    if(Array.isArray(st.holdings)){const keep=st.exPF?[]:st.holdings.filter(h=>!isOldExample(h));if(keep.length!==st.holdings.length)dirty=true;S.holdings=keep;
      S.holdings.forEach(h=>{if(h.type==='pms'&&!pmsById(h.pms)){const nm=norm(h.name),p=D.pms.find(x=>norm(x.n)===nm);dirty=true;if(p)h.pms=p.id;else{h.type='stock';h.name=h.name+' (PMS)';delete h.pms;}}});}
    if(st.aiPms&&st.aiPms.text)S.aiPms=st.aiPms;if(st.persona)S.persona=st.persona;
    setIPS();if(dirty)Store.save();if(!$('#sheet').classList.contains('open'))refresh();}
})();
})();
